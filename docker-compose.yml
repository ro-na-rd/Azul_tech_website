services:
  azul-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: azul-web-app
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - azul-network
    environment:
      - NODE_ENV=production
    # volumes:
    #   - ./logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  azul-network:
    driver: bridge

# If you want to use external nginx proxy
# volumes:
#   nginx-config:
#     external: true
